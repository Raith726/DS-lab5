spring.application.name=marketing

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/marketing_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

app.media-dir=${MEDIA_DIR:media}
app.base-url=${APP_BASE_URL:http://localhost:8081}
app.publicar-clave=${PUBLICAR_CLAVE:}

ia.gemini-key=${GEMINI_API_KEY:}
ia.gemini-model=${GEMINI_MODEL:gemini-flash-latest}

instagram.user-id=${INSTAGRAM_USER_ID:}
instagram.token=${INSTAGRAM_TOKEN:}

server.port=8080
