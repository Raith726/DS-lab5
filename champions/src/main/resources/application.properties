spring.application.name=champions

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/champions_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update

api.partidos.url=${API_PARTIDOS_URL:https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard}
api.partidos.desde=${API_PARTIDOS_DESDE:2026-09}
api.partidos.hasta=${API_PARTIDOS_HASTA:2027-06}

server.port=8080
