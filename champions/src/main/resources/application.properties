spring.application.name=champions

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/champions_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update

api.partidos.url=${API_PARTIDOS_URL:https://raw.githubusercontent.com/openfootball/football.json/master/2024-25/uefa.cl.json}

server.port=8080
